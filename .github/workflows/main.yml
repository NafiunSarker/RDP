name: macOS Remote Desktop Session

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure User & Enable Remote Management (VNC)
        run: |
          sudo sysadminctl -resetPasswordFor runner -newPassword "SecurePassword123!"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientfields 1 -legacy -setvnclegacy -vncsecret SecurePassword123! \
            -restart -agent -privs -all

      - name: Maintain Active Session
        run: |
          echo "macOS Session Ready!"
          echo "Connect via VNC using your Tailscale IP: vnc://<tailscale-ip>:5900"
          echo "Username: runner"
          echo "Password: SecurePassword123!"
          
          while true; do sleep 3600; done
